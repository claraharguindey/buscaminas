<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscaminas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1 id="gameTitleText" class="title"></h1>

        <div class="status">
            <span>Minas <b id="gameMinesLCD">000</b></span>
            <button onclick="restartGame()">Reiniciar</button>
            <span>Tiempo <b id="gameTimerLCD">000</b></span>
        </div>

        <div id="gameContainer" class="board grid">
            <div id="gameGrid" class="grid"></div>
        </div>

        <ul id="levelSelect" class="legend"></ul>
    </main>

    <script src="script.js"></script>
</body>

</html>
